# Mosquitto MQTT Broker Configuration
# File: mosquitto/mosquitto.conf
#
# Usage:
#   mosquitto -c mosquitto.conf
#   (or use start_broker.bat on Windows)

# ─── Network ─────────────────────────────────────────────────────────────────
listener 1883
# The listener is available on all interfaces so ESP32s on the same LAN can reach the broker.

# ─── Authentication ───────────────────────────────────────────────────────────
# For a development/lab environment only. In production use password_file.
allow_anonymous true

# ─── Persistence ─────────────────────────────────────────────────────────────
persistence true
# Đường dẫn tương đối: start_all.ps1 / start_broker.bat chạy Mosquitto trong thư mục mosquitto/
persistence_location data/
persistence_file mosquitto.db

# Autosave retained messages every 300 seconds
autosave_interval 300

# ─── Logging ─────────────────────────────────────────────────────────────────
log_type all
log_dest stdout
# log_dest file data/mosquitto.log
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ─── Connection tuning ───────────────────────────────────────────────────────

# Maximum inflight messages for QoS 1/2 per client
max_inflight_messages 20

# Queue size for QoS 1/2 messages when client is offline
max_queued_messages 100

# ─── WebSockets (optional — uncomment for browser clients) ───────────────────
# listener 9001
# protocol websockets

# ─── Bridge lên Cloud (tuỳ chọn) ─────────────────────────────────────────────
# Mọi file *.conf trong conf.d/ được nạp thêm. Tạo conf.d/cloud-bridge.conf từ file .example
# để gateway đẩy dữ liệu đã xử lý lên cloud và nhận lệnh từ Web console.
include_dir conf.d
